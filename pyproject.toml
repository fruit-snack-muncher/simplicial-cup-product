[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplicial-cup-product"
version = "0.1.0"
description = "Cup products on simplicial complexes"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/simplicial_cup_product"]

[tool.pytest.ini_options]
testpaths = ["tests"]